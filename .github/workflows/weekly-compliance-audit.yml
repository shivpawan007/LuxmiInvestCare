name: Weekly Random Compliance Audit

on:
  push:
    branches:
      - main
      - compliance-v1.1-hardening
      - compliance-mfd-automation-hardening
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-random-compliance-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check official SEBI and AMFI regulatory sources
        id: regulatory
        continue-on-error: true
        run: npm run compliance:regulatory-watch

      - name: Create regulatory review issue
        if: steps.regulatory.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="MFD regulatory review required: SEBI/AMFI source change or outage"
          EXISTING=$(gh issue list --state open --search "in:title $TITLE" --json number --jq 'length')
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "$TITLE" \
              --body "The automated Luxmi InvestCare MFD compliance watch detected a change or outage in an official SEBI/AMFI regulatory source. Review compliance/audit/regulatory-watch.json, compare the change against the current MFD Code of Conduct and applicable SEBI Mutual Fund requirements, update the website rules/content if required, and close this issue only after compliance scan, build, and production route audit pass."
          fi
      - name: Run compliance scan
        run: npm run compliance:scan

      - name: Run dependency security audit
        continue-on-error: true
        run: |
          mkdir -p compliance/audit
          npm audit --omit=dev --json > compliance/audit/npm-audit-production.json || true
          npm audit --json > compliance/audit/npm-audit-full.json || true

      - name: Run production build
        run: npm run build

      - name: Run weekly random audit
        id: audit
        continue-on-error: true
        env:
          AUDIT_BASE_URL: https://www.luxmiinvestcare.com
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run compliance:audit

      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: luxmi-weekly-compliance-audit
          path: compliance/audit/latest.json
          retention-days: 90
          overwrite: true

      - name: Commit latest audit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compliance/audit/latest.json compliance/audit/regulatory-watch.json
          if git diff --cached --quiet; then
            echo "No audit report changes to commit."
          else
            git commit -m "chore: update weekly compliance audit report"
            git push
          fi

      - name: Fail workflow when audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
