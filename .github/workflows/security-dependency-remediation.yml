name: Security Dependency Remediation

on:
  push:
    branches:
      - compliance-v1.1-hardening
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install and apply compatible security fixes
        run: |
          npm install
          npm audit fix

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Verify production build
        run: npm run build

      - name: Commit dependency remediation
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: remediate npm audit vulnerabilities"
          git push
