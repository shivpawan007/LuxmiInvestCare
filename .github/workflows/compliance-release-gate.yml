name: Compliance Release Gate

on:
  pull_request:
    branches:
      - main
      - compliance-v1-fixes
  push:
    branches:
      - compliance-v1.1-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Scan, production dependency audit and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run MFD compliance content scan
        run: npm run compliance:scan

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build production application
        run: npm run build
